<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demander un devis | Lamine Technologie</title><meta name="description" content="Demandez un devis à Lamine Technologie pour votre site web, application, logiciel métier ou projet informatique."><link rel="icon" href="favicon.svg" type="image/svg+xml"><style>:root{--blue:#075985;--cyan:#06b6d4;--navy:#082f49;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(135deg,#ecfeff,#f8fafc);color:var(--ink)}.wrap{max-width:900px;margin:auto;padding:35px 20px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.logo{font-size:1.6rem;font-weight:900;color:var(--navy)}.logo span{color:var(--cyan)}a{color:var(--blue);font-weight:700;text-decoration:none}.box{background:#fff;border:1px solid var(--line);border-radius:24px;padding:35px;box-shadow:0 18px 50px rgba(15,23,42,.1)}h1{font-size:2.5rem;line-height:1.1;margin:0 0 10px}p{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{margin-bottom:16px}.full{grid-column:1/-1}label{display:block;font-weight:750;margin-bottom:6px}input,select,textarea{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;font:inherit}textarea{min-height:150px;resize:vertical}input:focus,select:focus,textarea:focus{outline:0;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(6,182,212,.12)}.budget{display:flex;gap:10px;flex-wrap:wrap}.budget label{font-weight:600;background:#f8fafc;border:1px solid var(--line);padding:9px 12px;border-radius:10px;cursor:pointer}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}.btn{border:0;border-radius:999px;padding:13px 22px;background:linear-gradient(135deg,var(--blue),var(--cyan));color:white;font-weight:850;cursor:pointer}.outline{background:#fff;color:var(--blue);border:2px solid var(--blue)}.note{font-size:.9rem;margin-top:18px}.success{display:none;margin-top:18px;padding:15px;border-radius:12px;background:#ecfdf5;color:#166534;font-weight:650}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}h1{font-size:2rem}.box{padding:22px}.top{align-items:flex-start;gap:15px;flex-direction:column}}</style></head><body><div class="wrap"><div class="top"><a class="logo" href="index.html">LA<span>MINE</span></a><a href="index.html">← Retour au site</a></div><div class="box"><h1>Demander un devis</h1><p>Décrivez votre projet. Votre demande sera préparée automatiquement pour un envoi par email ou WhatsApp.</p><form id="quote"><div class="grid"><div class="field"><label for="name">Nom / entreprise *</label><input id="name" required placeholder="Votre nom ou entreprise"></div><div class="field"><label for="email">Email *</label><input id="email" type="email" required placeholder="votre@email.com"></div><div class="field"><label for="phone">Téléphone *</label><input id="phone" type="tel" required placeholder="+221 77 ..."></div><div class="field"><label for="service">Type de projet *</label><select id="service" required><option value="">Sélectionner</option><option>Site web</option><option>Application mobile</option><option>Logiciel métier / CRM</option><option>Réseau & sécurité</option><option>Maintenance / amélioration</option><option>Autre</option></select></div><div class="field"><label for="delay">Délai souhaité</label><select id="delay"><option>Pas encore défini</option><option>Urgent</option><option>1 à 2 semaines</option><option>1 mois</option><option>1 à 3 mois</option></select></div><div class="field"><label>Budget indicatif</label><div class="budget"><label><input type="radio" name="budget" value="À définir" checked> À définir</label><label><input type="radio" name="budget" value="Moins de 250 000 FCFA"> &lt; 250 000 FCFA</label><label><input type="radio" name="budget" value="250 000 à 500 000 FCFA"> 250–500k</label><label><input type="radio" name="budget" value="Plus de 500 000 FCFA"> &gt; 500k</label></div></div><div class="field full"><label for="message">Décrivez votre besoin *</label><textarea id="message" required placeholder="Objectif, fonctionnalités souhaitées, nombre d'utilisateurs, exemple de site ou logiciel, etc."></textarea></div></div><div class="actions"><button class="btn" type="submit">📧 Préparer ma demande par email</button><button class="btn outline" type="button" id="wa">💬 Envoyer par WhatsApp</button></div><p class="note">Contact direct : <a href="mailto:thioubdou@gmail.com">thioubdou@gmail.com</a> · <a href="tel:+221777545906">+221 77 754 59 06</a></p><div class="success" id="ok">Votre demande est prête. Votre application email va s'ouvrir.</div></form></div></div><script>function data(){return{n:document.getElementById('name').value,e:document.getElementById('email').value,p:document.getElementById('phone').value,s:document.getElementById('service').value,d:document.getElementById('delay').value,b:document.querySelector('input[name="budget"]:checked').value,m:document.getElementById('message').value}}function body(x){return`Demande de devis — Lamine Technologie\n\nNom / entreprise : ${x.n}\nEmail : ${x.e}\nTéléphone : ${x.p}\nProjet : ${x.s}\nDélai : ${x.d}\nBudget : ${x.b}\n\nBesoin :\n${x.m}`}document.getElementById('quote').addEventListener('submit',e=>{e.preventDefault();const x=data();document.getElementById('ok').style.display='block';location.href='mailto:thioubdou@gmail.com?subject='+encodeURIComponent('Demande de devis — '+x.s)+'&body='+encodeURIComponent(body(x))});document.getElementById('wa').addEventListener('click',()=>{const f=document.getElementById('quote');if(!f.reportValidity())return;const x=data();window.open('https://wa.me/221777545906?text='+encodeURIComponent(body(x)),'_blank')});</script></body></html>
